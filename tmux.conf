# Drag pane borders with the mouse. No key conflicts at all.
set -g mouse on

# Resize panes with prefix + shifted hjkl.
# macOS claims C-Left/C-Right (switch space), C-Up (Mission Control) and
# C-Down (App Expose), so the default C-<arrow> resize bindings never
# reach tmux. -r makes them repeatable: press C-b once, then tap H/J/K/L.
# This overrides the default `prefix L` (switch-client -l).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
