# Use Ctrl-Space as the tmux prefix. Ctrl-b is deliberately released.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Advertise a capable terminal inside tmux and enable true color for Ghostty.
set -g default-terminal 'tmux-256color'
set -s terminal-features[99] 'xterm-ghostty:RGB'
set -g set-clipboard on

# Start window and pane indexes at 1 and close numbering gaps automatically.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# General terminal behavior.
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on

# Open new windows and panes in the current pane's working directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Resize panes with prefix + shifted hjkl.
# -r makes them repeatable: press Ctrl-Space once, then tap H/J/K/L.
# This overrides the default `prefix L` (switch-client -l).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this file without restarting tmux.
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux reloaded'

# Vim-like copy mode. tmux-yank owns `y` and copies through macOS pbcopy.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind p paste-buffer
set -g @override_copy_command 'pbcopy'
set -g @yank_action 'copy-pipe-and-cancel'

# TPM-managed plugins. Keep TPM initialization last.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'hoshiya4522/tokyo-night-tmux'

run '~/.tmux/plugins/tpm/tpm'
